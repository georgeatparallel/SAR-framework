name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ scripts/ web/
      - name: Schema drift
        run: python scripts/generate_schemas.py --check
      - name: Offline test suite
        run: pytest -q -m "not slow and not live" --cov=sar --cov-report=term
      - name: Coverage floor on llm and orchestrator
        run: |
          pytest -q -m "not slow and not live" \
            --cov=sar.llm --cov=sar.orchestrator \
            --cov-fail-under=80 --cov-report=term
