[project]
name = "agentic-sar"
version = "2.0.0"
description = "Literature search and extraction whose every field cites the document it came from."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ignacio Urbina", email = "ignacio.urbina@stonybrook.edu" }]
keywords = ["research", "literature-review", "citations", "agents", "provenance"]
classifiers = [
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Kept deliberately small. A user who only wants extraction and citation
# checking should not download a browser engine.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Registered by default in every entry point. Left undeclared, the import
    # failed on any clean install and the engine silently dropped web/press
    # coverage from every run.
    "ddgs>=9.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
scrape = ["beautifulsoup4>=4.12", "lxml>=5.0", "playwright>=1.40"]
pdf = ["PyMuPDF>=1.24"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0"]
all = ["agentic-sar[openai,scrape,pdf,web]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # The content fetcher is core behaviour now, so its parsers must be present
    # in CI or its tests silently assert the degraded path. Playwright is
    # deliberately excluded: the tests disable browser rendering so the suite
    # stays offline and needs no browser binaries.
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyMuPDF>=1.24",
]

[project.urls]
Homepage = "https://github.com/ignaciourbina/SAR-framework"
Issues = "https://github.com/ignaciourbina/agentic-sar/issues"

[project.scripts]
sar = "sar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sar"]

[tool.hatch.build.targets.wheel.force-include]
"src/sar/py.typed" = "sar/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # SubstantiveLink.construct is ontology vocabulary; it shadows pydantic's
    # deprecated BaseModel.construct classmethod, which we never call.
    'ignore:Field name "construct":UserWarning',
]
markers = [
    "slow: hits real external APIs (deselect with '-m not slow')",
    "live: spawns the real codex CLI (deselect with '-m not live')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 (StrEnum) would change str(PipelinePhase.EXPAND) from
# "PipelinePhase.EXPAND" to "expand" everywhere the enums are formatted;
# suppressed deliberately rather than absorbed as a silent behavior change.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["src/sar"]
# Pragmatic baseline: catch real type errors without demanding full strictness
# on a codebase that talks to untyped provider SDKs. Tighten over time.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Optional extras ship no stubs, and the package must import without them.
[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "playwright.*",
    "openai.*",
    "ddgs.*",
    "duckduckgo_search.*",
    "bs4.*",
]
ignore_missing_imports = true
