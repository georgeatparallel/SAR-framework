
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Search</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: 0 auto; }
        #response, #history { white-space: pre-wrap; background: #f4f4f4; padding: 1em; margin-top: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agentic Search</h1>
        <form id="search-form">
            <input type="text" id="query" placeholder="Enter your search query" size="50">
            <button type="submit">Search</button>
        </form>
        <h2>Response</h2>
        <pre id="response">The agent's final response will appear here.</pre>
        <h2>Conversation History</h2>
        <pre id="history">The agent's conversation history will appear here.</pre>
    </div>
    <script>
        document.getElementById('search-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const query = document.getElementById('query').value;
            const responseContainer = document.getElementById('response');
            const historyContainer = document.getElementById('history');

            responseContainer.textContent = 'Thinking...';
            historyContainer.textContent = '';

            const res = await fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            const data = await res.json();

            responseContainer.textContent = data.response || JSON.stringify(data, null, 2);
            if (data.history) {
                historyContainer.textContent = JSON.stringify(data.history, null, 2);
            }
        });
    </script>
</body>
</html>
